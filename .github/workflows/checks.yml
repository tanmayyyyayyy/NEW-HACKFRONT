name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://skillforge-repository-desk.onrender.com
    env:
      APP_ORIGIN: http://localhost:3000
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: whygraph-local
      TEST_ORIGIN: http://localhost:3000
    services:
      neo4j:
        image: neo4j:5.26.27-community
        env:
          NEO4J_AUTH: neo4j/whygraph-local
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p whygraph-local 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:chat-unit
      - run: npm run check:chat
      - run: npx playwright install --with-deps chromium
      - name: Run browser checks against the production build
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)" npm run start:prod > "$RUNNER_TEMP/skillforge.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --retry 20 --retry-all-errors --retry-delay 1 "$TEST_ORIGIN/api/health"; then
            cat "$RUNNER_TEMP/skillforge.log"
            exit 1
          fi
          npm run check:ui
      - name: Report Live Deployment Link
        if: always()
        run: |
          echo "### 🚀 SkillForge AI Live Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: [https://skillforge-repository-desk.onrender.com](https://skillforge-repository-desk.onrender.com)" >> $GITHUB_STEP_SUMMARY
          echo "Health Check: [https://skillforge-repository-desk.onrender.com/api/health](https://skillforge-repository-desk.onrender.com/api/health)" >> $GITHUB_STEP_SUMMARY
