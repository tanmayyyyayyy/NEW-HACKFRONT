services:
  - type: web
    name: skillforge-repository-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ACCOUNT_DATABASE
        value: .local/accounts.sqlite
      - key: APP_ORIGIN
        value: https://skillforge-repository-desk.onrender.com
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
