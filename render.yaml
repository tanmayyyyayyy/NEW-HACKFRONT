
services:
  - type: web
    name: skillforge-integrated
    runtime: docker
    branch: main
    region: singapore
    plan: free
    healthCheckPath: /api/health
    dockerCommand: /usr/local/bin/skillforge-start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillforge-integrated-db
          property: connectionString
      - key: SCAN_WORKER_ENABLED
        value: "true"

databases:
  - name: skillforge-integrated-db
    region: singapore
    plan: free
    ipAllowList: []
